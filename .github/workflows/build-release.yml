name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'

      # 使用与本地 Debug 包相同的签名密钥，保证 release 可覆盖安装、数据不丢。
      # 密钥内容放在仓库 Settings → Secrets and variables → Actions 的
      # ANDROID_DEBUG_KEYSTORE（`base64 -w0 ~/.android/debug.keystore` 的输出）。
      - name: Restore debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE }}" | base64 -d > ~/.android/debug.keystore

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: floorplan-3d-release
          path: build/app/outputs/flutter-apk/app-release.apk
